server.port=${PORT:8080}
spring.application.name=${APP_NAME:EcommerceApp}

# CORS allowed origins (read by WebConfig)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# -----------------------------------------------------------------------
# DataSource
# Default: H2 in-memory (works with no setup, data resets on restart)
# PostgreSQL: set DB_URL, DB_USER, DB_PASSWORD from your database panel
#   DB_URL example: jdbc:postgresql://HOST:5432/DBNAME
# The driver class and Hibernate dialect are auto-detected from the JDBC
# URL by Spring Boot 3 / Hibernate 6, so no explicit dialect is needed for
# either H2 (local) or PostgreSQL (deployed). PostgreSQL-specific DataSource
# settings are applied in DataSourceConfig when DB_URL starts with jdbc:postgresql.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console - useful during local dev to inspect the in-memory DB
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
